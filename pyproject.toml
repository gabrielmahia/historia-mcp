[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historia-mcp"
version = "0.1.13"
description = "Kenya and Africa historical archives via MCP. 7 tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.4"]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
historia-mcp = "historia_mcp.server:mcp.run"

[project.urls]
Issues = "https://github.com/gabrielmahia/historia-mcp/issues"
Homepage = "https://github.com/gabrielmahia/historia-mcp"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"
[tool.setuptools.packages.find]
where = ["src"]
